volumes:
  pg_data:
services:
  backend:
    build: app/
    ports:
      - 8000:8000
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0943jfd
      POSTGRES_DB: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ELASTIC_API_KEY: VnJmZlJaOEI2Z3NYZzZHUnRqVVA6bWN2eURQUW5jSHdIbHFIWkQ0VW9sZw==
    depends_on:
      - db
  db:
    image:
      postgres:18
    ports:
      - 5433:5432
    environment:
      POSTGRES_PASSWORD: 0943jfd
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s