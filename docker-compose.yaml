volumes:
  pg_data:
services:
  backend:
    build: ./backend/
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
  db:
    image:
      postgres:18
    container_name: db
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: 45652jkl
      volumes: pg_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
