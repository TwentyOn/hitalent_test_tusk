volumes:
  pg_data:
services:
  backend:
    build: app/
    ports:
      - 8000:8000
    env_file: app/.env
    depends_on:
      - db
  db:
    image:
      postgres:18
    ports:
      - 5433:5432
    environment:
      POSTGRES_PASSWORD: 0943jfd
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s