<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 p-4 md:p-8 font-sans antialiased">
    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-sm p-4 md:p-8">

        <!-- Заголовок -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <h1 class="text-2xl md:text-3xl font-semibold text-gray-800">Реестр сотрудников</h1>
            <button class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium
                           transition-colors flex items-center gap-2 text-sm md:text-base whitespace-nowrap">
                <span class="text-xl leading-none">+</span> Добавить сотрудника
            </button>
        </div>

        <!-- Поиск и фильтры -->
        <div class="bg-gray-50 rounded-lg p-4 md:p-5 mb-6">
            <div class="flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[180px]">
                    <label class="block text-xs font-medium text-gray-600 mb-1.5">Поиск</label>
                    <input type="text" placeholder="ФИО, телефон..."
                           class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm
                                  focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="flex-1 min-w-[150px]">
                    <label class="block text-xs font-medium text-gray-600 mb-1.5">Пол</label>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                            <input type="checkbox" checked class="w-4 h-4 text-blue-600 rounded border-gray-300">
                            Муж
                        </label>
                        <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                            <input type="checkbox" checked class="w-4 h-4 text-blue-600 rounded border-gray-300">
                            Жен
                        </label>
                    </div>
                </div>
                <div class="flex-1 min-w-[180px]">
                    <label class="block text-xs font-medium text-gray-600 mb-1.5">Возраст</label>
                    <div class="flex items-center gap-2">
                        <input type="number" placeholder="с" min="0"
                               class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm
                                      focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <span class="text-gray-500 font-medium">—</span>
                        <input type="number" placeholder="по" min="0"
                               class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm
                                      focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>
                <button class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium
                               transition-colors text-sm whitespace-nowrap">
                    Поиск
                </button>
            </div>
        </div>

        <!-- Таблица -->
        <div class="table-wrapper overflow-x-auto rounded-lg border border-gray-200">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="px-4 py-3 text-left font-semibold text-gray-600 whitespace-nowrap">№ id</th>
                        <th class="px-4 py-3 text-left font-semibold text-gray-600 whitespace-nowrap">Фото</th>
                        <th class="px-4 py-3 text-left font-semibold text-gray-600 whitespace-nowrap">ФИО</th>
                        <th class="px-4 py-3 text-left font-semibold text-gray-600 whitespace-nowrap">Возраст</th>
                        <th class="px-4 py-3 text-left font-semibold text-gray-600 whitespace-nowrap">Телефон</th>
                        <th class="px-4 py-3 text-left font-semibold text-gray-600 whitespace-nowrap">Пол</th>
                        <th class="px-4 py-3 text-left font-semibold text-gray-600 whitespace-nowrap">Действие</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    {% for employee in employees %}
                        <!-- Сотрудник 1 -->
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-4 py-3 text-gray-700">1</td>
                            <td class="px-4 py-3">
                                <div class="photo-wrapper" data-full="https://i.pravatar.cc/500?img=1">
                                    <img src="https://i.pravatar.cc/40?img=1"
                                         alt="Фото"
                                         class="w-10 h-10 rounded-full object-cover">
                                    <div class="photo-overlay"></div>
                                    <div class="photo-tooltip" id="tooltip1">
                                        <img src="https://i.pravatar.cc/500?img=1" alt="Фото крупно">
                                    </div>
                                </div>
                            </td>
                            <td class="px-4 py-3 font-medium text-gray-800">{{ employee.name }}</td>
                            <td class="px-4 py-3 text-gray-600">{{ employee.age }} лет</td>
                            <td class="px-4 py-3 text-gray-600">+{{ employee.phone }}</td>
                            <td class="px-4 py-3">
                                <span class="inline-block px-3 py-1 rounded-full text-xs font-medium bg-blue-50 text-blue-700">
                                    {{ employee.sex }}
                                </span>
                            </td>
                            <td class="px-4 py-3">
                                <div class="flex gap-2">
                                    <button class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded text-gray-700 text-xs font-medium transition-colors">
                                        Ред.
                                    </button>
                                    <button class="px-3 py-1 bg-red-50 hover:bg-red-100 rounded text-red-600 text-xs font-medium transition-colors">
                                        Удал
                                    </button>
                                </div>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- Пагинация -->
        <div class="flex justify-center gap-2 mt-6">
            <a href="#" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors">1</a>
            <a href="#" class="px-4 py-2 bg-white text-gray-700 rounded-lg text-sm font-medium border border-gray-200 hover:bg-gray-50 transition-colors">2</a>
            <a href="#" class="px-4 py-2 bg-white text-gray-700 rounded-lg text-sm font-medium border border-gray-200 hover:bg-gray-50 transition-colors">3</a>
        </div>
    </div>
</body>
</html>
